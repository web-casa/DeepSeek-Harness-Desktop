# Pinned toolchain: CI and local builds must not drift across a floating
# `stable` (a future compiler version could fail the build or change clippy
# lints mid-release). Bump deliberately and re-run the full gate suite.
#
# No `targets` here: cross-target checks are the explicit `rustup target add`
# steps in quality.yml — listing them here would make every runner (including
# Windows/macOS, where they are useless) install the cross targets too.
[toolchain]
channel = "1.96.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
