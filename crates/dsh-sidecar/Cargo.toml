[package]
name = "dsh-sidecar"
version = "0.1.0"
description = "Minimal process supervisor for the DeepSeek Harness Desktop runtime"
edition = "2021"
license = "MIT"

[dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_Environment",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
strip = true
codegen-units = 1
