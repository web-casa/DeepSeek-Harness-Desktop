version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    # Abu-style split: patch/minor batches land as grouped PRs; MAJOR bumps
    # match no group and open individual PRs for human review (the TS7 PR
    # that broke CI is the canonical example).
    groups:
      frontend-patch:
        patterns: ["*"]
        update-types: ["patch"]
      frontend-minor:
        patterns: ["*"]
        update-types: ["minor"]
    # typescript majors are blocked: TS 7 (tsgo) is outside svelte-check's
    # supported matrix (peer range ^5 || ^6). Upgrade 5 -> 6 deliberately
    # (vite-env.d.ts already provides the vite/client types TS >= 6 needs).
    # NOTE: ignore rules do NOT apply to security updates — review any
    # security PR against the AGENTS.md frontend upgrade gate.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /runtime
    schedule:
      interval: weekly
    groups:
      harness-runtime:
        patterns: ["*"]
    # The bundled runtime is pinned via runtime-manifest.json — pull requests
    # here still require the manifest + CI smoke update before merging.
    #
    # Harness upgrades MUST go through the AGENTS.md startup-contract
    # checklist, so ALL @deepseek-ai/dsh version updates are ignored (not
    # just majors: 0.1.0-rc -> 0.2.0-rc is a *minor* per SemVer and would
    # bypass a semver-major ignore). Bump manually: pin + lock + manifest +
    # full smoke.
    # NOTE: ignore rules do NOT apply to security updates. A security PR
    # would change pin + lock but NOT runtime-manifest.json — CI's
    # version-drift assertion will fail it until the full checklist is done
    # manually; never merge such a PR incomplete.
    ignore:
      - dependency-name: "@deepseek-ai/dsh"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    # tauri major bumps (2 -> 3) are a real migration (API, bundler,
    # capability schema), not a routine update — gate them like typescript
    # majors and upgrade deliberately. tauri* covers the lockstep siblings
    # (tauri-build, tauri-plugin-single-instance, tauri-plugin-window-state)
    # which migrate together with the core crate.
    # NOTE: ignore rules do NOT apply to security updates — a security PR
    # may still cross majors; treat it like a deliberate migration.
    ignore:
      - dependency-name: "tauri*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /crates/dsh-sidecar
    schedule:
      interval: weekly
