name: Bug 报告 / Bug report
description: 报告缺陷（桌面层 / 打包 / 生命周期）。Report a defect in the desktop layer, packaging, or lifecycle.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: 版本 / Version
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台 / Platform
      options: [Windows x64, macOS arm64, 其他/Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 现象 / What happened
      placeholder: 描述发生了什么，包括任何错误提示或白屏情况。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: 1. … 2. …
    validations:
      required: true
  - type: textarea
    id: diag
    attributes:
      label: 诊断信息 / Diagnostics（可选）
      description: 应用内「诊断」页的日志尾部（其中可能含敏感信息，请自行脱敏）。
    validations:
      required: false
