name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (SHA-pinned)

      # Blocks PRs that introduce vulnerable dependencies (any severity) or
      # GPL/AGPL/LGPL licenses. NOTE: requires the repo's Dependency graph to
      # be enabled (org setting); until an org admin flips it on, the step
      # degrades to a warning instead of blocking CI.
      - name: Dependency Review
        continue-on-error: true
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4.9.0 (SHA-pinned)
        with:
          fail-on-severity: low
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-3.0-only, LGPL-2.1-only, LGPL-3.0-only
