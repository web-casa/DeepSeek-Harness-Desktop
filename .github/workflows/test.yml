name: Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege: every job here only reads the checkout (quality.yml brings
# its own block); nothing in this workflow needs write access to the repo.
permissions:
  contents: read

# A newer commit supersedes every check from the previous PR revision. Avoid
# keeping obsolete cross-platform builds alive for hours.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    uses: ./.github/workflows/quality.yml

  smoke:
    name: Runtime smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (SHA-pinned)

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable (version via rust-toolchain.toml)

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10 (SHA-pinned)
      # Version source of truth: packageManager in package.json (action-setup
      # v6 reads it when `version` is omitted; mismatches fail loudly).
      # MUST precede setup-node: its cache step needs `pnpm store path`.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0 (SHA-pinned)
        with:
          node-version-file: .nvmrc
          # The smoke job never runs pnpm — caching its store dir would fail
          # the post step. It DOES npm-ci the runtime, so cache that instead.
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      # The exact P0 acceptance chain, on every platform:
      # sidecar → bundled node → dsh web --port 0 → readiness → HTTP 200
      # → restart → HTTP 200 → shutdown → no orphan processes.
      - name: Download bundled Node
        run: node scripts/download-node.ts

      - name: Prepare Harness runtime
        run: node scripts/prepare-harness.ts

      - name: Build sidecar (host triple)
        run: node scripts/build-sidecar.ts

      - name: Check staged runtime links are relocatable
        run: node scripts/check-runtime-links.ts

      - name: Runtime smoke
        run: node scripts/verify-runtime.ts

      # Hung-but-alive detection: fake harnesses (hang + healthy negative
      # case) driven through the real sidecar on every platform.
      - name: Liveness heartbeat smoke
        run: node scripts/verify-heartbeat.ts

      # Proves the shell importer's on-disk layout is what UPSTREAM's
      # discoverPresets finds (trust=user, not broken) — no UI needed.
      - name: Preset discovery smoke
        run: node scripts/verify-preset.ts

      # Drives the REAL `dsh plugin` chain (bundled pnpm shim + PATH +
      # initProfile + reconcilePlugins) against an isolated DSH_HOME.
      - name: Plugin install smoke
        run: node scripts/verify-plugins.ts

      - name: Sideload plugin smoke
        run: node scripts/verify-sideload.ts

      - name: Relocation smoke
        run: node scripts/relocate-runtime.ts && node scripts/verify-runtime.ts --runtime-dir .tmp/relocated-runtime
