name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      native_target:
        type: choice
        required: false
        default: all
        options:
          - all
          - macos-x64
          - macos-arm64
        description: "Limit a manual verification to one macOS target; tag releases always build all targets."
      preset_slug:
        type: string
        required: false
        default: code
        description: "Public Cordis preset slug that must return a direct ZIP response."
      windows_smoke_source_run_id:
        type: string
        required: false
        description: "Completed Release run ID whose Windows x64 and ARM64 artifacts should be smoke-tested without rebuilding."
      windows_smoke_installer:
        type: choice
        required: false
        default: all
        options:
          - all
          - nsis
          - msi
        description: "Installer smoke to run when reusing a completed Release run."

# Read-only baseline for every job. Cross-run Windows smoke needs Actions
# artifact access; only the `release` job escalates contents to write when it
# publishes a GitHub Release.
permissions:
  actions: read
  contents: read

# Never run two expensive release builds for the same ref concurrently. A
# queued manual verification must not cancel an in-flight signed tag build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plan:
    name: Validate release matrix
    # A manually selected workflow ref must never start the signing/build graph:
    # dispatches are allowed only from reviewed main. Every subsequent native
    # build depends on this plan; the separate read-only diagnosis path below
    # remains explicitly scoped to an already completed same-repository run.
    if: github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event.inputs.windows_smoke_source_run_id == '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.matrix.outputs.native }}
      msix: ${{ steps.matrix.outputs.msix }}
      macos_notarization: ${{ steps.matrix.outputs.macos_notarization }}
    steps:
      # Standard hosted runners are free only for public repositories. This
      # release deliberately builds six native lanes, so fail before the
      # expensive matrix if repository visibility changes without a reviewed
      # billing decision.
      - name: Require public-repository free runner policy
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [[ "$REPOSITORY_PRIVATE" != "false" ]]; then
            echo "::error::The native release matrix uses standard hosted runners under the public-repository free-runner policy. Re-review billing before releasing from a private repository."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (SHA-pinned)
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0 (SHA-pinned)
        with:
          node-version-file: .nvmrc

      - name: Emit reviewed native, notarization, and Store matrices
        id: matrix
        env:
          # workflow_dispatch values are external data even when the UI offers
          # a choice. Keep them out of the shell source; release-plan.ts then
          # enforces its exact reviewed target allowlist.
          NATIVE_TARGET: ${{ github.event.inputs.native_target || 'all' }}
        run: |
          native="$(node scripts/release-plan.ts --github-matrix --target "$NATIVE_TARGET")"
          macos_notarization="$(node scripts/release-plan.ts --github-macos-notarization-matrix --target "$NATIVE_TARGET")"
          {
            echo "native=$native"
            echo "msix=$(node scripts/release-plan.ts --github-msix-matrix)"
            echo "macos_notarization=$macos_notarization"
          } >> "$GITHUB_OUTPUT"

  # The desktop deliberately refuses redirects/non-JSON responses at its
  # Cordis trust boundaries. Keep production probes independent of native
  # builds: a backend contract regression must block tag publication, while
  # workflow_dispatch can still collect installer evidence for diagnosis.
  preset-download-contract:
    name: Cordis production API contracts
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.windows_smoke_source_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (SHA-pinned)
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0 (SHA-pinned)
        with:
          node-version-file: .nvmrc

      - name: Require direct HTTP 200 application/zip
        run: node scripts/verify-cordis-preset-download.ts
        env:
          CORDIS_PRESET_SLUG: ${{ github.event.inputs.preset_slug || 'code' }}

      - name: Require direct market JSON, ETag/304, and JSON 404
        run: node scripts/verify-cordis-market-api.ts

  quality:
    name: Quality gates
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.windows_smoke_source_run_id == ''
    uses: ./.github/workflows/quality.yml
    with:
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.ref }}

  # Refuse to spend two platform builds (and a publish) on a tag that can
  # never be published: the tag commit must be an ancestor of main. The
  # release-preflight branch check is local-only (skipped in CI), so without
  # this gate a tag pushed from a feature branch would sail through. Full
  # main history is fetched so --is-ancestor can walk it.
  #
  # Semantics: the tag must be created ON main AFTER the merge. A tag on a
  # feature branch that is later squash-merged is rejected (the squash commit
  # is a different commit), as is any tag after a force-push rewrite of main.
  # workflow_dispatch skips this job (skipped needs are satisfied).
  tag-gate:
    name: Tag gate (tag must be on main)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (SHA-pinned)
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.ref }}

      - name: Enforce tag ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD || {
            echo "::error::tag $RELEASE_TAG is not an ancestor of origin/main — refusing to build/publish"
            exit 1
          }

  # Load soak under CPU contention (production-default heartbeat knobs).
  # Release-only: PRs must not pay the staging + soak minutes (review I7).
  # Failure gates the `release` job below (needs): it runs in parallel with
  # the platform builds, so the gate costs no extra wall time.
  soak:
    name: Heartbeat load soak (Linux, 5min)
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.native_target == 'all'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (SHA-pinned)
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0 (SHA-pinned)
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable branch (toolchain version pinned via rust-toolchain.toml)

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # v2 (SHA-pinned)
        with:
          # build-sidecar.ts pins CARGO_TARGET_DIR here — the soak's staging
          # step would otherwise recompile the sidecar from cold every release.
          cache-directories: crates/dsh-sidecar/target

      - name: Stage runtime (Node + Harness + sidecar)
        run: |
          node scripts/download-node.ts
          node scripts/prepare-harness.ts
          node scripts/build-sidecar.ts

      - name: Load soak (5 minutes, 2 CPU burners)
        run: node scripts/load-soak.ts --duration-min 5 --cpu-burn 2

  build:
    name: Build ${{ matrix.target }}
    # workflow_dispatch is the build+verify-only channel, and tag-gate is
    # skipped there. A skipped `needs` entry would otherwise skip build too.
    # Run whenever quality succeeded and tag-gate did not FAIL (skipped is
    # explicitly allowed for dispatch).
    if: >-
      !cancelled() &&
      needs.release-plan.result == 'success' &&
      needs.quality.result == 'success' &&
      (needs.tag-gate.result == 'success' || needs.tag-gate.result == 'skipped')
    needs: [quality, tag-gate, release-plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.native) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (SHA-pinned)
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.ref }}

      - name: Install Linux bundle and Flatpak dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 35
        run: bash scripts/ci/install-linux-release-deps.sh

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable branch (toolchain version pinned via rust-toolchain.toml)

      - name: Assert native build host
        # Matrix values are emitted from the reviewed static release plan.
        # Expand them before the runner shell so Windows pwsh and Unix bash
        # receive the same literal argument; `$RELEASE_TARGET` is Bash-only.
        run: node scripts/verify-native-host.ts --target "${{ matrix.target }}"

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # v2 (SHA-pinned)
        with:
          # build-sidecar.ts pins CARGO_TARGET_DIR to crates/dsh-sidecar/target
          # for deterministic staging — cache it explicitly or the heaviest
          # step stays cold.
          cache-directories: crates/dsh-sidecar/target

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10 (SHA-pinned)
      # Version source of truth: packageManager in package.json (action-setup
      # v6 reads it when `version` is omitted; mismatches fail loudly).
      # MUST precede setup-node: its cache step needs `pnpm store path`.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0 (SHA-pinned)
        with:
          node-version-file: .nvmrc
          # One cache per job: the runtime npm ci (prepare-harness) is the
          # heavy install; the root pnpm install is small and stays cold.
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: Release preflight (versions, checksums, npm policy)
        run: node scripts/release-preflight.ts

      - name: Frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download bundled Node
        run: node scripts/download-node.ts

      - name: Prepare Harness runtime
        run: node scripts/prepare-harness.ts

      - name: Build sidecar (host triple)
        run: node scripts/build-sidecar.ts

      - name: Assert staged runtime has no symlinks
        run: node scripts/check-runtime-links.ts

      # Smoke the exact runtime that will be bundled, BEFORE bundling.
      - name: Runtime smoke (pre-bundle)
        run: node scripts/verify-runtime.ts

      - name: Sideload plugin smoke (pre-bundle)
        run: node scripts/verify-sideload.ts

      - name: Preseed SHA-256-verified AppImage tools
        if: matrix.appImageTools
        run: node scripts/prepare-appimage-tools.ts --arch ${{ matrix.arch }}
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/dsh-cache
          GITHUB_TOKEN: ${{ github.token }}

      # Both platform signing paths remain optional, but become fail-closed
      # once their primary certificate secret is configured. macOS uses the
      # job-scoped keychain below; Windows imports its PFX into the user store.
      - name: Import Windows Authenticode certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Host "WINDOWS_CERTIFICATE is not configured; building intentionally unsigned installers."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD is required when WINDOWS_CERTIFICATE is configured"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) {
            throw "WINDOWS_TIMESTAMP_URL is required when WINDOWS_CERTIFICATE is configured"
          }
          $encoded = Join-Path $env:RUNNER_TEMP "dsh-windows-certificate.txt"
          $pfx = Join-Path $env:RUNNER_TEMP "dsh-windows-certificate.pfx"
          try {
            [IO.File]::WriteAllText($encoded, $env:WINDOWS_CERTIFICATE)
            certutil -f -decode $encoded $pfx
            if ($LASTEXITCODE -ne 0) { throw "certutil failed to decode WINDOWS_CERTIFICATE" }
            $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            $imported = @(Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password)
            $signingCertificates = @($imported | Where-Object { $_.HasPrivateKey })
            if ($signingCertificates.Count -ne 1) {
              throw "expected exactly one imported certificate with a private key, found $($signingCertificates.Count)"
            }
            "WINDOWS_CERTIFICATE_THUMBPRINT=$($signingCertificates[0].Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } finally {
            Remove-Item -LiteralPath $encoded, $pfx -Force -ErrorAction SilentlyContinue
          }

      # Resolve one complete authentication provider without logging secrets.
      # ASC API-key auth is preferred when present; existing Apple ID auth is
      # retained as a no-migration fallback for notarytool.
      - name: Detect macOS signing configuration
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: node scripts/detect-macos-signing.ts

      # Tauri signs the app executable and conventional nested-code folders,
      # but our bundled Node/Harness lives under Contents/Resources. Import
      # the identity early, preserve the compliant upstream Node signature,
      # and sign every other Mach-O resource before Tauri signs the outer app.
      # The bounded builder below signs the DMG; notarization is deferred to
      # the Submission-ID handoff.
      - name: Import macOS Developer ID certificate
        if: runner.os == 'macOS' && env.APPLE_SIGNING_CONFIGURED == '1'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: node scripts/import-apple-certificate.ts

      - name: Sign nested macOS runtime
        if: runner.os == 'macOS' && env.APPLE_SIGNING_CONFIGURED == '1'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/sign-macos-runtime.ts

      - name: Runtime smoke (post-sign)
        if: runner.os == 'macOS' && env.APPLE_SIGNING_CONFIGURED == '1'
        run: node scripts/verify-runtime.ts

      - name: Bundle macOS app (unsigned)
        if: runner.os == 'macOS' && env.APPLE_SIGNING_CONFIGURED == '0'
        run: pnpm tauri build --bundles ${{ matrix.tauriBundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Deliberately omit every notarization credential here. Tauri signs the
      # app with APPLE_SIGNING_IDENTITY but cannot enter its built-in unbounded
      # `notarytool --wait` path. DMG construction and submission follow.
      - name: Bundle macOS app (signed; notarization deferred)
        if: runner.os == 'macOS' && env.APPLE_SIGNING_CONFIGURED == '1'
        run: pnpm tauri build --bundles ${{ matrix.tauriBundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Tauri's styled DMG path mounts a writable image and drives Finder via
      # AppleScript. Hosted Intel runners can leave diskimages-helper blocked
      # there for tens of minutes. Build the already-signed app into a
      # compressed image directly: no mount, Finder, AppleScript, or detach.
      - name: Build macOS DMG without Finder automation
        if: runner.os == 'macOS'
        timeout-minutes: 35
        run: node scripts/build-macos-dmg.ts --arch ${{ matrix.arch }}

      - name: Verify signed DMG before notarization
        if: runner.os == 'macOS' && env.APPLE_SIGNING_CONFIGURED == '1'
        run: |
          node scripts/verify-bundle.ts --bundle dmg --arch ${{ matrix.arch }}
          node scripts/verify-signing.ts --bundle dmg --phase pre-notarization
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}

      # No private signing key is needed after the DMG has been signed and
      # verified. Remove it before Apple issues a Submission ID so a cleanup
      # failure can never turn a successful upload into a duplicate on rerun.
      - name: Remove job-scoped macOS signing keychain before submission
        if: runner.os == 'macOS' && env.APPLE_SIGNING_CONFIGURED == '1' && env.APPLE_KEYCHAIN_PATH != ''
        shell: bash
        run: |
          security delete-keychain "$APPLE_KEYCHAIN_PATH"
          echo "APPLE_KEYCHAIN_PATH=" >> "$GITHUB_ENV"

      - name: Install SHA-256-verified ASC CLI
        if: runner.os == 'macOS' && env.APPLE_SIGNING_CONFIGURED == '1' && env.APPLE_NOTARIZATION_PROVIDER == 'asc'
        run: node scripts/prepare-asc-cli.ts --arch ${{ matrix.arch }}

      - name: Submit signed DMG without waiting
        if: runner.os == 'macOS' && env.APPLE_SIGNING_CONFIGURED == '1'
        run: node scripts/macos-notarization.ts submit --target ${{ matrix.target }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}

      - name: Upload notarization handoff
        if: runner.os == 'macOS' && env.APPLE_SIGNING_CONFIGURED == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 (SHA-pinned)
        with:
          name: ${{ matrix.notarizationArtifact }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz.sig
            target/notarization/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Bundle application (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_THUMBPRINT)) {
            pnpm tauri build --bundles "${{ matrix.tauriBundles }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $configPath = Join-Path $env:RUNNER_TEMP "tauri-windows-signing.json"
            @{
              bundle = @{
                windows = @{
                  certificateThumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT
                  digestAlgorithm = "sha256"
                  timestampUrl = $env:WINDOWS_TIMESTAMP_URL
                }
              }
            } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $configPath -Encoding utf8
            pnpm tauri build --bundles "${{ matrix.tauriBundles }}" --config $configPath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Linux update commands are deliberately unsupported. Do not emit inert
      # updater tarballs/signatures for AppImage while building public package
      # formats that are checksum-protected instead.
      - name: Bundle application (Linux)
        if: runner.os == 'Linux'
        run: >-
          pnpm tauri build
          --bundles ${{ matrix.tauriBundles }}
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/dsh-cache

      - name: Build Flatpak from the Tauri DEB
        if: matrix.flatpak
        run: node scripts/build-flatpak.ts --arch ${{ matrix.arch }}

      # Content, architecture, manifest, deep-link, materialization, signing,
      # and checksum checks run once for every format in this matrix row.
      - name: Verify complete native release set
        if: runner.os != 'macOS' || env.APPLE_SIGNING_CONFIGURED == '0'
        run: node scripts/verify-release-set.ts --target ${{ matrix.target }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}

      - name: Upload bundle artifact
        if: runner.os != 'macOS' || env.APPLE_SIGNING_CONFIGURED == '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 (SHA-pinned)
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove remaining job-scoped macOS signing keychain
        if: runner.os == 'macOS' && always() && env.APPLE_KEYCHAIN_PATH != ''
        shell: bash
        run: |
          if ! security delete-keychain "$APPLE_KEYCHAIN_PATH"; then
            echo "::warning::failed to remove ephemeral signing keychain; runner teardown will discard it"
          fi

  # The build job above succeeds as soon as Apple has accepted each upload and
  # persists its Submission ID with the exact DMG hash. This bounded job only
  # polls that ID. If Apple remains In Progress, use "Re-run failed jobs": the
  # successful build matrix is not repeated, so no duplicate is submitted.
  notarize-macos:
    name: Notarize macOS ${{ matrix.arch }}
    if: >-
      !cancelled() &&
      needs.release-plan.result == 'success' &&
      needs.build.result == 'success'
    needs: [build, release-plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.macos_notarization) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (SHA-pinned)
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0 (SHA-pinned)
        with:
          node-version-file: .nvmrc

      - name: Detect macOS signing configuration
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: node scripts/detect-macos-signing.ts

      - name: Download notarization handoff
        if: env.APPLE_SIGNING_CONFIGURED == '1'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4 (SHA-pinned)
        with:
          name: ${{ matrix.handoffArtifact }}
          path: target

      - name: Install SHA-256-verified ASC CLI
        if: env.APPLE_SIGNING_CONFIGURED == '1' && env.APPLE_NOTARIZATION_PROVIDER == 'asc'
        run: node scripts/prepare-asc-cli.ts --arch ${{ matrix.arch }}

      - name: Wait for the recorded Apple submission
        if: env.APPLE_SIGNING_CONFIGURED == '1'
        timeout-minutes: 25
        run: node scripts/macos-notarization.ts wait --target ${{ matrix.target }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
          DSH_NOTARIZATION_WAIT_MINUTES: "20"
          DSH_NOTARIZATION_POLL_SECONDS: "60"

      - name: Verify accepted and stapled release set
        if: env.APPLE_SIGNING_CONFIGURED == '1'
        run: node scripts/verify-release-set.ts --target ${{ matrix.target }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}

      - name: Upload final macOS artifact
        if: env.APPLE_SIGNING_CONFIGURED == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 (SHA-pinned)
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload notarization diagnostics
        if: failure() && env.APPLE_SIGNING_CONFIGURED == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 (SHA-pinned)
        with:
          name: dsh-macos-notarization-diagnostics-${{ matrix.arch }}-${{ github.run_attempt }}
          path: target/notarization
          if-no-files-found: ignore
          retention-days: 7

  build-msix:
    name: Build MSIX ${{ matrix.arch }}
    if: |
      always() &&
      needs.release-plan.result == 'success' &&
      needs.quality.result == 'success' &&
      needs.tag-gate.result != 'failure' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.native_target == 'all')
    needs: [quality, tag-gate, release-plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.msix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      STORE_BUILD: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (SHA-pinned)
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.ref }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable (version via rust-toolchain.toml)
        with:
          targets: ${{ matrix.target }}

      - name: Assert native Store build host
        # See the native build job: avoid shell-specific environment syntax.
        run: node scripts/verify-native-host.ts --target "${{ matrix.nativeTarget }}"

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # v2 (SHA-pinned)
        with:
          workspaces: |
            src-tauri -> target
          cache-directories: crates/dsh-sidecar/target

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10 (SHA-pinned)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0 (SHA-pinned)
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: Release preflight
        run: node scripts/release-preflight.ts

      - name: Frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage Node + Harness runtime + sidecar (native arch)
        run: |
          node scripts/download-node.ts
          node scripts/prepare-harness.ts
          node scripts/build-sidecar.ts
          node scripts/check-runtime-links.ts

      - name: Build MSIX
        shell: pwsh
        run: |
          $env:STORE_BUILD = "1"
          pnpm tauri:windows:build --arch ${{ matrix.arch }}

      - name: Verify MSIX package
        run: node scripts/verify-msix.ts --arch ${{ matrix.arch }}

      - name: Emit MSIX SHA-256 checksum
        run: node scripts/checksums-msix.ts --arch ${{ matrix.arch }}

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 (SHA-pinned)
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/msix/*_${{ matrix.arch }}.msix
            target/msix/*_${{ matrix.arch }}.msix.sha256
          if-no-files-found: error
          retention-days: 14

  windows-smoke-source:
    name: Validate Windows smoke source run
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.windows_smoke_source_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a completed same-repository Release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.inputs.windows_smoke_source_run_id }}
        run: |
          if [[ ! "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::windows_smoke_source_run_id must be a positive numeric Actions run ID"
            exit 1
          fi

          source_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          source_repository="$(jq -r '.head_repository.full_name // ""' <<< "$source_run")"
          source_workflow="$(jq -r '.path // ""' <<< "$source_run")"
          source_status="$(jq -r '.status // ""' <<< "$source_run")"
          source_sha="$(jq -r '.head_sha // ""' <<< "$source_run")"

          if [[ "$source_repository" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::source run belongs to $source_repository, expected $GITHUB_REPOSITORY"
            exit 1
          fi
          if [[ "$source_workflow" != ".github/workflows/release.yml" ]]; then
            echo "::error::source run used $source_workflow, expected .github/workflows/release.yml"
            exit 1
          fi
          if [[ "$source_status" != "completed" ]]; then
            echo "::error::source run is $source_status; wait for it to complete before reusing artifacts"
            exit 1
          fi

          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")"
          for artifact_name in \
            deepseek-harness-desktop-windows-x64 \
            deepseek-harness-desktop-windows-arm64; do
            artifact_count="$(jq --arg name "$artifact_name" \
              '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
              <<< "$artifacts")"
            if [[ "$artifact_count" != "1" ]]; then
              echo "::error::expected one unexpired $artifact_name artifact, got $artifact_count"
              exit 1
            fi
          done

          echo "Reusing Windows x64 and ARM64 artifacts from Release run $SOURCE_RUN_ID ($source_sha)"

  windows-deep-link-smoke:
    name: Windows ${{ matrix.label }} deep-link installer smoke
    if: >-
      ${{
        always() &&
        (
          (
            github.event_name == 'workflow_dispatch' &&
            github.event.inputs.windows_smoke_source_run_id != '' &&
            github.event.inputs.windows_smoke_installer != 'msi' &&
            needs.windows-smoke-source.result == 'success'
          ) ||
          (
            (
              (github.event_name == 'workflow_dispatch' && github.event.inputs.native_target == 'all') ||
              (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
            ) &&
            github.event.inputs.windows_smoke_source_run_id == '' &&
            needs.build.result == 'success'
          )
        )
      }}
    needs: [build, windows-smoke-source]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64 native
            os: windows-latest
            artifact: deepseek-harness-desktop-windows-x64
          - label: ARM64 native
            os: windows-11-arm
            artifact: deepseek-harness-desktop-windows-arm64
          # Windows on ARM supports x64 application emulation. Keep this as a
          # compatibility smoke, distinct from the ARM64 native build above.
          - label: x64 compatibility on ARM64
            os: windows-11-arm
            artifact: deepseek-harness-desktop-windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4 (SHA-pinned)
        with:
          name: ${{ matrix.artifact }}
          path: artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.windows_smoke_source_run_id || github.run_id }}

      - name: Silent install NSIS
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path artifacts -Recurse -File -Filter '*-setup.exe')
          if ($installers.Count -ne 1) {
            throw "expected exactly one NSIS installer, got $($installers.Count)"
          }
          $installer = $installers[0]
          Write-Host "Installing $($installer.FullName)"
          $p = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }

      - name: Verify dsharness registry registration
        shell: pwsh
        run: |
          $keys = @(
            "Registry::HKEY_CURRENT_USER\Software\Classes\dsharness\shell\open\command",
            "Registry::HKEY_LOCAL_MACHINE\Software\Classes\dsharness\shell\open\command"
          )
          $found = $false
          foreach ($key in $keys) {
            if (Test-Path $key) {
              $command = (Get-ItemProperty $key).'(default)'
              Write-Host "$key -> $command"
              if ($command -notlike "*deepseek-harness-desktop.exe*") {
                throw "registered command does not point at the desktop binary: $command"
              }
              if ($command -notlike '*"%1"*') {
                throw "registered command does not forward the URL argument: $command"
              }
              $found = $true
            }
          }
          if (-not $found) { throw "dsharness URL protocol is not registered" }

      - name: Cold-start via dsharness URL
        shell: pwsh
        run: |
          Get-Process deepseek-harness-desktop -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = 'dsharness://plugin/install?v=1&name=is-odd&source=https%3A%2F%2Fcordis.run%2Fplugins%2Fis-odd'
          $psi.UseShellExecute = $true
          [System.Diagnostics.Process]::Start($psi) | Out-Null
          Start-Sleep -Seconds 20
          $procs = @(Get-Process deepseek-harness-desktop -ErrorAction SilentlyContinue)
          if ($procs.Count -ne 1) { throw "expected exactly one app process after dsharness:// cold-start, got $($procs.Count)" }
          Write-Host "app running pid=$($procs[0].Id)"

      - name: Warm relaunch via dsharness URL
        shell: pwsh
        run: |
          $before = @(Get-Process deepseek-harness-desktop -ErrorAction SilentlyContinue)
          if ($before.Count -ne 1) { throw "expected exactly one app process before warm link, got $($before.Count)" }
          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = 'dsharness://plugin/install?v=1&name=is-odd&source=https%3A%2F%2Fcordis.run%2Fen%2Fplugins%2Fis-odd'
          $psi.UseShellExecute = $true
          [System.Diagnostics.Process]::Start($psi) | Out-Null
          Start-Sleep -Seconds 10
          $after = @(Get-Process deepseek-harness-desktop -ErrorAction SilentlyContinue)
          if ($after.Count -ne 1) { throw "expected exactly one app process after warm dsharness:// link, got $($after.Count)" }
          if ($after[0].Id -ne $before[0].Id) { throw "warm link spawned a second instance; single-instance failed" }
          Write-Host "single instance retained pid=$($after[0].Id)"

      - name: Preset cold-start via dsharness://preset/install
        shell: pwsh
        run: |
          Get-Process deepseek-harness-desktop -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = 'dsharness://preset/install?v=1&url=https%3A%2F%2Fcordis.run%2Fapi%2Fpresets%2Fis-odd%2Fdownload&source=https%3A%2F%2Fcordis.run%2Fpresets%2Fis-odd'
          $psi.UseShellExecute = $true
          [System.Diagnostics.Process]::Start($psi) | Out-Null
          Start-Sleep -Seconds 20
          $procs = @(Get-Process deepseek-harness-desktop -ErrorAction SilentlyContinue)
          if ($procs.Count -ne 1) { throw "expected exactly one app process after preset cold-start, got $($procs.Count)" }
          Write-Host "preset cold-start app pid=$($procs[0].Id)"

      - name: Preset warm relaunch keeps single instance
        shell: pwsh
        run: |
          $before = @(Get-Process deepseek-harness-desktop -ErrorAction SilentlyContinue)
          if ($before.Count -ne 1) { throw "expected exactly one app process before preset warm link, got $($before.Count)" }
          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = 'dsharness://preset/install?v=1&url=https%3A%2F%2Fcordis.run%2Fapi%2Fpresets%2Fis-odd%2Fdownload&source=https%3A%2F%2Fcordis.run%2Fen%2Fpresets%2Fis-odd'
          $psi.UseShellExecute = $true
          [System.Diagnostics.Process]::Start($psi) | Out-Null
          Start-Sleep -Seconds 10
          $after = @(Get-Process deepseek-harness-desktop -ErrorAction SilentlyContinue)
          if ($after.Count -ne 1) { throw "expected exactly one app process after preset warm link, got $($after.Count)" }
          if ($after[0].Id -ne $before[0].Id) { throw "preset warm link spawned a second instance" }
          Write-Host "preset single instance retained pid=$($after[0].Id)"

      # This is deliberately more than a protocol-registration test.  An
      # in-place NSIS reinstall exercises the updater's installer family
      # boundary, then the sidecar is launched from the *installed* runtime
      # with a disposable DSH_HOME.  That catches an installer which appears
      # healthy but omitted/mismatched node, Harness, or sidecar resources.
      # It is an in-place-reinstall smoke, not a claim that a previous-version
      # migration was tested; previous-version release assets are not assumed
      # to exist for every native architecture.
      - name: In-place NSIS reinstall and installed Harness smoke
        shell: pwsh
        timeout-minutes: 10
        run: |
          Get-Process deepseek-harness-desktop -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3

          $installers = @(Get-ChildItem -Path artifacts -Recurse -File -Filter '*-setup.exe')
          if ($installers.Count -ne 1) {
            throw "expected exactly one NSIS installer, got $($installers.Count)"
          }
          $reinstall = Start-Process -FilePath $installers[0].FullName -ArgumentList "/S" -Wait -PassThru
          if ($reinstall.ExitCode -ne 0) { throw "in-place NSIS reinstall exit $($reinstall.ExitCode)" }

          $keys = @(
            "Registry::HKEY_CURRENT_USER\Software\Classes\dsharness\shell\open\command",
            "Registry::HKEY_LOCAL_MACHINE\Software\Classes\dsharness\shell\open\command"
          )
          $desktopPaths = @($keys | Where-Object { Test-Path $_ } | ForEach-Object {
            $command = (Get-ItemProperty $_).'(default)'
            $match = [regex]::Match(
              $command,
              '^"([^"]+\.exe)"\s+"%1"$',
              [System.Text.RegularExpressions.RegexOptions]::IgnoreCase
            )
            if (-not $match.Success) { throw "invalid NSIS protocol command: $command" }
            $match.Groups[1].Value
          } | Sort-Object -Unique)
          if ($desktopPaths.Count -ne 1) {
            throw "expected one installed desktop executable after NSIS reinstall, got $($desktopPaths.Count)"
          }
          $desktopExe = $desktopPaths[0]
          if (-not (Test-Path -LiteralPath $desktopExe -PathType Leaf)) {
            throw "registered desktop executable disappeared after NSIS reinstall: $desktopExe"
          }

          # Split-Path cannot combine -LiteralPath with -Parent in PowerShell's
          # parameter sets. Use the .NET path API so a registered executable
          # containing wildcard characters is still treated literally.
          $installRoot = [System.IO.Path]::GetDirectoryName($desktopExe)
          if ([string]::IsNullOrWhiteSpace($installRoot)) {
            throw "registered desktop executable has no parent directory: $desktopExe"
          }
          $runtime = Join-Path $installRoot 'runtime'
          $sidecar = Join-Path $runtime 'sidecar.exe'
          $node = Join-Path $runtime 'node.exe'
          $harness = Join-Path $runtime 'harness'
          $dsh = Join-Path $harness 'node_modules\@deepseek-ai\dsh\lib\bin.js'
          foreach ($path in @($sidecar, $node, $harness, $dsh)) {
            if (-not (Test-Path -LiteralPath $path)) { throw "installed runtime resource missing: $path" }
          }

          $dshHome = Join-Path $env:RUNNER_TEMP 'dsh-installed-nsis-smoke-home'
          New-Item -ItemType Directory -Force -Path $dshHome | Out-Null
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $sidecar
          $startInfo.WorkingDirectory = $runtime
          $startInfo.UseShellExecute = $false
          $startInfo.CreateNoWindow = $true
          $startInfo.RedirectStandardInput = $true
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          $startInfo.Environment['DSH_HOME'] = $dshHome
          $startInfo.Environment['DSH_TELEMETRY_DISABLED'] = '1'
          $sidecarProcess = [System.Diagnostics.Process]::new()
          $sidecarProcess.StartInfo = $startInfo
          if (-not $sidecarProcess.Start()) { throw 'could not launch installed sidecar' }
          $stderrTask = $sidecarProcess.StandardError.ReadToEndAsync()
          $lines = [System.Collections.Generic.List[string]]::new()
          $ready = $null
          try {
            $startPayload = @{
              id = 1
              command = 'start'
              node = $node
              script = $dsh
              args = @('web', '--no-open', '--host', '127.0.0.1', '--port', '0')
              cwd = $harness
              env = @{ DSH_HOME = $dshHome; DSH_TELEMETRY_DISABLED = '1' }
            } | ConvertTo-Json -Compress -Depth 4
            $sidecarProcess.StandardInput.WriteLine($startPayload)
            $sidecarProcess.StandardInput.Flush()
            $lineTask = $sidecarProcess.StandardOutput.ReadLineAsync()
            $deadline = [DateTime]::UtcNow.AddMinutes(3)
            while ([DateTime]::UtcNow -lt $deadline -and -not $sidecarProcess.HasExited) {
              if (-not $lineTask.Wait(250)) { continue }
              $line = $lineTask.GetAwaiter().GetResult()
              if ($null -eq $line) { break }
              if ($lines.Count -ge 120) { $lines.RemoveAt(0) }
              $lines.Add($line)
              try { $event = $line | ConvertFrom-Json -ErrorAction Stop } catch {
                throw "installed sidecar emitted non-JSON stdout: $line"
              }
              if ($event.type -eq 'ready' -and $event.url) {
                $ready = $event
                break
              }
              $lineTask = $sidecarProcess.StandardOutput.ReadLineAsync()
            }
            if ($null -eq $ready) {
              $stderr = if ($stderrTask.Wait(2000)) { $stderrTask.GetAwaiter().GetResult() } else { '' }
              throw "installed Harness never became ready; sidecar output: $($lines -join "`n"); stderr: $stderr"
            }
            $response = Invoke-WebRequest -Uri $ready.url -UseBasicParsing -TimeoutSec 20
            if ($response.StatusCode -ne 200) {
              throw "installed Harness GET $($ready.url) returned HTTP $($response.StatusCode)"
            }
            if ($response.Content -notmatch '<!doctype|<html|<div') {
              throw "installed Harness returned a non-HTML body ($($response.Content.Length) bytes)"
            }
            Write-Host "installed Harness ready at $($ready.url) after in-place NSIS reinstall"
          } finally {
            if (-not $sidecarProcess.HasExited) {
              try {
                $sidecarProcess.StandardInput.WriteLine('{"id":2,"command":"shutdown"}')
                $sidecarProcess.StandardInput.Flush()
              } catch { }
              if (-not $sidecarProcess.WaitForExit(30000)) {
                $sidecarProcess.Kill($true)
                $sidecarProcess.WaitForExit(5000) | Out-Null
              }
            }
            $sidecarProcess.Dispose()
          }

  windows-msi-smoke:
    name: Windows ${{ matrix.label }} MSI installer smoke
    if: >-
      ${{
        always() &&
        (
          (
            github.event_name == 'workflow_dispatch' &&
            github.event.inputs.windows_smoke_source_run_id != '' &&
            github.event.inputs.windows_smoke_installer != 'nsis' &&
            needs.windows-smoke-source.result == 'success'
          ) ||
          (
            (
              (github.event_name == 'workflow_dispatch' && github.event.inputs.native_target == 'all') ||
              (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
            ) &&
            github.event.inputs.windows_smoke_source_run_id == '' &&
            needs.build.result == 'success'
          )
        )
      }}
    needs: [build, windows-smoke-source]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64 native en-US
            os: windows-latest
            artifact: deepseek-harness-desktop-windows-x64
            msiLocale: en-US
          - label: x64 native zh-CN
            os: windows-latest
            artifact: deepseek-harness-desktop-windows-x64
            msiLocale: zh-CN
          - label: ARM64 native en-US
            os: windows-11-arm
            artifact: deepseek-harness-desktop-windows-arm64
            msiLocale: en-US
          - label: ARM64 native zh-CN
            os: windows-11-arm
            artifact: deepseek-harness-desktop-windows-arm64
            msiLocale: zh-CN
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4 (SHA-pinned)
        with:
          name: ${{ matrix.artifact }}
          path: artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.windows_smoke_source_run_id || github.run_id }}

      - name: Silent install MSI
        shell: pwsh
        timeout-minutes: 12
        env:
          MSI_LOCALE: ${{ matrix.msiLocale }}
        run: |
          $locale = $env:MSI_LOCALE
          $expectedLanguages = @{ "en-US" = "1033"; "zh-CN" = "2052" }
          $expectedLanguage = $expectedLanguages[$locale]
          if ([string]::IsNullOrWhiteSpace($expectedLanguage)) {
            throw "unreviewed MSI locale: $locale"
          }
          $installers = @(Get-ChildItem -Path artifacts -Recurse -File -Filter '*.msi' | Where-Object {
            $_.Name.EndsWith("_$locale.msi", [System.StringComparison]::Ordinal)
          })
          if ($installers.Count -ne 1) {
            throw "expected exactly one $locale MSI installer, got $($installers.Count)"
          }
          $installer = $installers[0]
          $windowsInstaller = New-Object -ComObject WindowsInstaller.Installer
          $database = $windowsInstaller.OpenDatabase($installer.FullName, 0)
          $view = $database.OpenView('SELECT `Value` FROM `Property` WHERE `Property` = ''ProductLanguage''')
          $view.Execute()
          $record = $view.Fetch()
          if ($null -eq $record) { throw "MSI ProductLanguage is missing" }
          $productLanguage = $record.StringData(1)
          if ($productLanguage -ne $expectedLanguage) {
            throw "MSI ProductLanguage $productLanguage does not match $locale ($expectedLanguage)"
          }
          Write-Host "MSI installer locale verified: $locale ($productLanguage)"
          $logPath = Join-Path $env:RUNNER_TEMP 'dsh-msi-install.log'
          $quotedInstaller = '"' + $installer.FullName + '"'
          $quotedLogPath = '"' + $logPath + '"'
          $arguments = "/i $quotedInstaller /qn /norestart /l*v $quotedLogPath"
          Write-Host "Installing $($installer.FullName)"
          $process = Start-Process -FilePath msiexec.exe -ArgumentList $arguments -PassThru

          if (-not $process.WaitForExit(600000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $logPath) {
              Write-Host '::group::MSI log tail after timeout'
              Get-Content -LiteralPath $logPath -Tail 200
              Write-Host '::endgroup::'
            }
            throw "MSI installer exceeded the 10-minute process timeout"
          }

          if ($process.ExitCode -notin @(0, 3010)) {
            if (Test-Path -LiteralPath $logPath) {
              Write-Host '::group::MSI failure log tail'
              Get-Content -LiteralPath $logPath -Tail 200
              Write-Host '::endgroup::'
            }
            throw "MSI installer exit $($process.ExitCode)"
          }

      - name: Verify MSI dsharness registration and installed binary
        shell: pwsh
        run: |
          $keys = @(
            "Registry::HKEY_CURRENT_USER\Software\Classes\dsharness\shell\open\command",
            "Registry::HKEY_LOCAL_MACHINE\Software\Classes\dsharness\shell\open\command"
          )
          $commands = @($keys | Where-Object { Test-Path $_ } | ForEach-Object {
            (Get-ItemProperty $_).'(default)'
          })
          if ($commands.Count -lt 1) { throw "MSI did not register dsharness" }
          foreach ($command in $commands) {
            $match = [regex]::Match(
              $command,
              '^"([^"]+\.exe)"\s+"%1"$',
              [System.Text.RegularExpressions.RegexOptions]::IgnoreCase
            )
            if (-not $match.Success) {
              throw "invalid MSI protocol command: $command"
            }
            $registeredPath = $match.Groups[1].Value
            if (-not (Test-Path -LiteralPath $registeredPath -PathType Leaf)) {
              throw "MSI protocol command does not point to an installed binary: $command"
            }
            $installedBinary = Get-Item -LiteralPath $registeredPath
            $installedFileName = [System.IO.Path]::GetFileName($installedBinary.FullName)
            if ($installedFileName -ine 'deepseek-harness-desktop.exe') {
              throw "MSI protocol command points to unexpected executable $($installedBinary.FullName)"
            }
            Write-Host "MSI installed $($installedBinary.FullName)"
          }

  macos-deep-link-smoke:
    name: macOS ${{ matrix.arch }} deep-link installer smoke
    if: >-
      ${{
        always() &&
        needs.release-plan.result == 'success' &&
        (
          (github.event_name == 'workflow_dispatch' &&
            (github.event.inputs.native_target == 'all' || startsWith(github.event.inputs.native_target, 'macos-'))) ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        ) &&
        needs.build.result == 'success' &&
        needs.notarize-macos.result == 'success'
      }}
    needs: [build, notarize-macos, release-plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.macos_notarization) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4 (SHA-pinned)
        with:
          name: ${{ matrix.artifact }}
          path: artifacts

      - name: Mount and copy app
        run: |
          dmg=$(find artifacts -name '*.dmg' | head -1)
          [ -n "$dmg" ] || { echo "dmg not found"; exit 1; }
          mountpoint=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mountpoint" "$dmg"
          mkdir -p "$HOME/Applications"
          rm -rf "$HOME/Applications/DSH Desktop.app"
          cp -R "$mountpoint/DSH Desktop.app" "$HOME/Applications/DSH Desktop.app"
          hdiutil detach "$mountpoint"

      - name: Verify Info.plist registers dsharness
        run: |
          app="$HOME/Applications/DSH Desktop.app"
          plutil -extract CFBundleURLTypes xml1 -o - "$app/Contents/Info.plist" > /tmp/cfbundle.xml
          cat /tmp/cfbundle.xml
          grep -q '<string>dsharness</string>' /tmp/cfbundle.xml

      - name: Register with LaunchServices and cold-open
        run: |
          app="$HOME/Applications/DSH Desktop.app"
          lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          xattr -dr com.apple.quarantine "$app" 2>/dev/null || true
          "$lsregister" -f -R "$app"
          sleep 3
          "$lsregister" -dump > /tmp/lsregister-dump.txt
          grep -q 'claimed schemes:.*dsharness' /tmp/lsregister-dump.txt
          grep -q 'claim id:.*com.yeagoo.dsh-desktop dsharness' /tmp/lsregister-dump.txt
          grep -A4 -B2 dsharness /tmp/lsregister-dump.txt || true
          pkill -f "deepseek-harness-desktop" 2>/dev/null || true
          open "dsharness://plugin/install?v=1&name=is-odd&source=https%3A%2F%2Fcordis.run%2Fplugins%2Fis-odd"
          sleep 20
          pgrep -f "DSH Desktop.app/Contents/MacOS/deepseek-harness-desktop" || {
            echo "app was not launched by dsharness:// cold-start"
            exit 1
          }

      - name: Warm open keeps single process
        run: |
          before=$(pgrep -f "DSH Desktop.app/Contents/MacOS/deepseek-harness-desktop" | head -1)
          [ -n "$before" ] || { echo "app not running before warm link"; exit 1; }
          open "dsharness://plugin/install?v=1&name=is-odd&source=https%3A%2F%2Fcordis.run%2Fen%2Fplugins%2Fis-odd"
          sleep 10
          after=$(pgrep -f "DSH Desktop.app/Contents/MacOS/deepseek-harness-desktop" | wc -l | tr -d ' ')
          echo "before_pid=$before after_count=$after"
          [ "$after" -eq 1 ] || { echo "expected one app process after warm link"; exit 1; }

      - name: Preset cold-open via dsharness://preset/install
        run: |
          pkill -f "DSH Desktop.app/Contents/MacOS/deepseek-harness-desktop" 2>/dev/null || true
          sleep 2
          open "dsharness://preset/install?v=1&url=https%3A%2F%2Fcordis.run%2Fapi%2Fpresets%2Fis-odd%2Fdownload&source=https%3A%2F%2Fcordis.run%2Fpresets%2Fis-odd"
          sleep 15
          pgrep -f "DSH Desktop.app/Contents/MacOS/deepseek-harness-desktop" || {
            echo "app was not launched by preset deep-link cold-start"
            exit 1
          }

      - name: Preset warm open keeps single process
        run: |
          before=$(pgrep -f "DSH Desktop.app/Contents/MacOS/deepseek-harness-desktop" | head -1)
          [ -n "$before" ] || { echo "app not running before preset warm link"; exit 1; }
          open "dsharness://preset/install?v=1&url=https%3A%2F%2Fcordis.run%2Fapi%2Fpresets%2Fis-odd%2Fdownload&source=https%3A%2F%2Fcordis.run%2Fen%2Fpresets%2Fis-odd"
          sleep 10
          after=$(pgrep -f "DSH Desktop.app/Contents/MacOS/deepseek-harness-desktop" | wc -l | tr -d ' ')
          echo "before_pid=$before after_count=$after"
          [ "$after" -eq 1 ] || { echo "expected one app process after preset warm link"; exit 1; }

  release:
    name: Publish GitHub Release
    # Only real tag pushes publish; workflow_dispatch is the build+verify-only
    # test channel. The Windows smoke jobs intentionally inherit a skipped
    # windows-smoke-source ancestor on tag pushes. `always()` prevents that
    # transitive skip from suppressing publication, while the explicit result
    # checks keep every real release gate fail-closed.
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/') &&
        needs.build.result == 'success' &&
        needs.notarize-macos.result == 'success' &&
        needs.build-msix.result == 'success' &&
        needs.soak.result == 'success' &&
        needs.tag-gate.result == 'success' &&
        needs.windows-deep-link-smoke.result == 'success' &&
        needs.windows-msi-smoke.result == 'success' &&
        needs.macos-deep-link-smoke.result == 'success' &&
        needs.preset-download-contract.result == 'success'
      }}
    # soak is a publish gate: a heartbeat regression must surface before
    # release, and the 5-minute soak overlaps the (much longer) platform
    # builds, so waiting on it adds no wall time.
    needs: [build, notarize-macos, build-msix, soak, tag-gate, windows-deep-link-smoke, windows-msi-smoke, macos-deep-link-smoke, preset-download-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (SHA-pinned)
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0 (SHA-pinned)
        with:
          node-version-file: .nvmrc

      # Tag ancestry was already enforced by the tag-gate job before the
      # build; this job only binds the tag to the version it publishes.
      # The tag must be bound to the version it publishes: v9.9.9 must never
      # ship artifacts whose embedded desktop version is 0.1.0.
      - name: Release preflight (tag binding)
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-preflight.ts --expect-tag "$RELEASE_TAG"

      # Download only the public website artifacts. Store MSIX artifacts stay
      # workflow-only and must never be swept into the GitHub Release.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4 (SHA-pinned)
        with:
          pattern: deepseek-harness-desktop-*
          path: artifacts

      - name: Verify complete public release inventory
        run: node scripts/verify-release-inventory.ts --directory artifacts

      - name: Cryptographically verify updater artifact/signature pairs
        run: node scripts/verify-updater-signatures.ts --directory artifacts

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2 (SHA-pinned)
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*

      # The upload action normalizes public asset filenames. Inspect the draft
      # through GitHub's API before publishing so each sidecar names the asset
      # users can actually download and matches GitHub's server-side digest.
      - name: Audit draft Release SHA-256 sidecars
        run: node scripts/verify-release-checksums.ts --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}

      # The updater manifest needs the ABSOLUTE asset URLs that only exist
      # after the release is created; fail-closed if an exact NSIS
      # architecture has no artifact+sig pair. Generic Windows targets are
      # forbidden: they would let an MSI install consume an NSIS update.
      # macOS is intentionally absent until updater artifacts are notarized.
      - name: Publish updater manifest (latest.json)
        run: node scripts/updater-manifest.ts --tag "$RELEASE_TAG" --platforms windows-x86_64-nsis,windows-aarch64-nsis
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          # gh CLI does NOT auto-authenticate from the ambient GITHUB_TOKEN;
          # it needs GH_TOKEN explicitly (the job's contents: write applies).
          GH_TOKEN: ${{ github.token }}

      # Keep the release private until every public artifact, including the
      # updater manifest, has passed its exact pairing and signature checks.
      # A draft is invisible to /releases/latest/download/latest.json, so
      # leaving this step out would make successfully built NSIS clients see
      # a stale manifest forever.
      - name: Publish reviewed GitHub Release
        run: gh release edit "$RELEASE_TAG" --draft=false
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
