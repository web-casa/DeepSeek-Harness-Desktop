name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
            bundle: nsis
            artifact: deepseek-harness-desktop-windows-x64
            glob: src-tauri/target/release/bundle/nsis/*-setup.exe
          - target: macos-arm64
            os: macos-14
            bundle: dmg
            artifact: deepseek-harness-desktop-macos-arm64
            glob: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download bundled Node
        run: node scripts/download-node.ts

      - name: Build sidecar (host triple)
        run: node scripts/build-sidecar.ts

      - name: Prepare Harness runtime
        run: node scripts/prepare-harness.ts

      # Smoke the exact runtime that will be bundled, BEFORE bundling.
      - name: Runtime smoke (pre-bundle)
        run: node scripts/verify-runtime.ts

      # Code signing & updater (P3) — wire these secrets when available:
      #   TAURI_SIGNING_PRIVATE_KEY(_PASSWORD)  updater signature keypair
      #   WINDOWS_CERTIFICATE(_PASSWORD)        Authenticode PFX (OV; EV needs HSM)
      #   APPLE_CERTIFICATE / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
      #       Developer ID signing + notarization (staple happens in tauri CLI)
      - name: Bundle application
        run: pnpm tauri build --bundles ${{ matrix.bundle }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*
