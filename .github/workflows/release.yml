name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: false
        description: "Tag/branch to build & verify (defaults to the default branch). Does not publish."

jobs:
  quality:
    name: Quality gates
    uses: ./.github/workflows/quality.yml

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
            bundle: nsis
            artifact: deepseek-harness-desktop-windows-x64
            glob: target/release/bundle/nsis/*-setup.exe
          - target: macos-arm64
            os: macos-14
            bundle: dmg
            artifact: deepseek-harness-desktop-macos-arm64
            glob: target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Release preflight (versions, checksums, npm policy)
        run: node scripts/release-preflight.ts

      - name: Frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download bundled Node
        run: node scripts/download-node.ts

      - name: Build sidecar (host triple)
        run: node scripts/build-sidecar.ts

      - name: Prepare Harness runtime
        run: node scripts/prepare-harness.ts

      - name: Assert staged runtime has no symlinks
        run: node scripts/check-runtime-links.ts

      # Smoke the exact runtime that will be bundled, BEFORE bundling.
      - name: Runtime smoke (pre-bundle)
        run: node scripts/verify-runtime.ts

      # Code signing & updater (P3) — wire these secrets when available:
      #   TAURI_SIGNING_PRIVATE_KEY(_PASSWORD)  updater signature keypair
      #   WINDOWS_CERTIFICATE(_PASSWORD)        Authenticode PFX (OV; EV needs HSM)
      #   APPLE_CERTIFICATE / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
      #       Developer ID signing + notarization (staple happens in tauri CLI)
      - name: Bundle application
        run: pnpm tauri build --bundles ${{ matrix.bundle }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Installer content assertion: main binary type, full runtime tree,
      # platform-specific node-pty prebuild, zero symlinks in the harness tree.
      - name: Verify bundle contents
        run: node scripts/verify-bundle.ts --bundle ${{ matrix.bundle }}

      # Unsigned distribution: give users a checksum file for verification.
      - name: Emit SHA-256 checksum
        run: node scripts/checksums.ts --bundle ${{ matrix.bundle }}

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.glob }}
            ${{ matrix.glob }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    # Only real tag pushes publish; workflow_dispatch is the build+verify-only
    # test channel.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The tag must be bound to the version it publishes: v9.9.9 must never
      # ship artifacts whose embedded desktop version is 0.1.0.
      - name: Release preflight (tag binding)
        run: node scripts/release-preflight.ts --expect-tag ${{ github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          files: artifacts/*
