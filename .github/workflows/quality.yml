name: Quality

# Reusable strict-gate suite: unit/property/coverage/lint/supply-chain/frontend.
# Called by test.yml (push/PR) AND release.yml (tag) so a tag can never publish
# without the full gate suite passing.

on:
  workflow_call:

# Reusable workflow: callers (test.yml / release.yml) do not escalate the
# GITHUB_TOKEN, and the gate suite only ever reads the checkout.
permissions:
  contents: read

jobs:
  quality:
    name: Quality gates (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (SHA-pinned)

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable (version via rust-toolchain.toml)

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4 (SHA-pinned, peeled commit)
      # Version source of truth: packageManager in package.json (action-setup
      # v4 reads it when `version` is omitted; mismatches fail loudly).
      # MUST precede setup-node: its cache step needs `pnpm store path`.

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4 (SHA-pinned)
        with:
          node-version-file: .nvmrc

      # Tauri shell system deps (compiling src-tauri requires webkit2gtk-4.1).
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install cargo tools (nextest, llvm-cov, deny, vet)
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1  # v2 (SHA-pinned)
        with:
          # Versions pinned to the locally verified set: a floating @latest
          # already broke CI once (cargo-vet 0.10.0 in CI rejects the
          # trusted-publisher entries that 0.10.2 — local and crates.io
          # latest — generates and accepts). cargo-vet@0.10.2 has no GitHub
          # release, so install-action falls back to cargo-binstall (crates.io).
          tool: cargo-nextest@0.9.143,cargo-llvm-cov@0.8.7,cargo-deny@0.20.2,cargo-vet@0.10.2

      - name: Install llvm-tools for coverage
        run: rustup component add llvm-tools-preview

      - name: Sidecar tests (nextest)
        run: cargo nextest run --manifest-path crates/dsh-sidecar/Cargo.toml

      - name: Sidecar coverage (llvm-cov, process lifecycle paths)
        run: cargo llvm-cov nextest --manifest-path crates/dsh-sidecar/Cargo.toml --fail-under-lines 50

      - name: Sidecar cross-target clippy (Windows + macOS)
        # The sidecar carries hand-rolled platform code behind #[cfg(windows)];
        # the Linux clippy run below never compiles it. Clippy --target checks
        # (no linking) enforce the same -D warnings lint set on both targets.
        # (The Tauri shell's Windows-only code is linted by the dedicated
        # `quality-windows` job — its build.rs needs llvm-rc, which Linux CI
        # lacks.)
        run: |
          rustup target add x86_64-pc-windows-msvc aarch64-apple-darwin
          cargo clippy --target x86_64-pc-windows-msvc --manifest-path crates/dsh-sidecar/Cargo.toml --all-targets -- -D warnings
          cargo clippy --target aarch64-apple-darwin --manifest-path crates/dsh-sidecar/Cargo.toml --all-targets -- -D warnings

      - name: "Tauri shell tests (nextest: state machine + proptests)"
        run: |
          # tauri-build asserts the bundle resources path exists; the smoke
          # job stages the real runtime — the unit job only needs the dir.
          mkdir -p src-tauri/resources/runtime
          cargo nextest run --manifest-path src-tauri/Cargo.toml

      - name: Tauri coverage (llvm-cov)
        run: cargo llvm-cov nextest --manifest-path src-tauri/Cargo.toml --fail-under-lines 25

      - name: Rust formatting & clippy
        run: |
          cargo fmt --check --manifest-path crates/dsh-sidecar/Cargo.toml
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path crates/dsh-sidecar/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Supply-chain gate (cargo-deny)
        run: |
          cargo deny --manifest-path crates/dsh-sidecar/Cargo.toml check
          cargo deny --manifest-path src-tauri/Cargo.toml check

      - name: Supply-chain audit (cargo-vet)
        run: cargo vet --locked

      - name: Frontend install & build
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Frontend type checks (tsc + svelte-check)
        run: pnpm check

      - name: Scripts type check (Node-native TS)
        run: pnpm check:scripts

      - name: Scripts unit tests (node:test, zero-dep)
        run: pnpm test:scripts

      # The ONLY blocking npm-side vulnerability gates: dependency-review is
      # org-gated (continue-on-error), so the two lockfiles get their own
      # audits. --audit-level=high keeps triage noise down.
      - name: npm dependency audit (runtime lock)
        run: npm audit --omit=dev --audit-level=high
        working-directory: runtime

      - name: pnpm dependency audit (root lock)
        run: pnpm audit --prod --audit-level high

      - name: Bundle verifier self-test
        run: node scripts/verify-bundle.ts --self-test

      - name: Heartbeat simulator self-test
        run: node scripts/verify-heartbeat.ts --self-test

      - name: Signing verifier self-test
        run: node scripts/verify-signing.ts --self-test

  # Lint the #[cfg(windows)] code the Linux job cannot compile: the Tauri
  # shell's Windows-only paths (tray, window events) and the sidecar's hand-
  # rolled console/Job code. Runs on a Windows runner where llvm-rc exists
  # (a Linux host cannot cross-lint src-tauri: its build.rs needs llvm-rc,
  # which rustup only ships for Windows hosts).
  quality-windows:
    name: Quality gates (Windows host)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (SHA-pinned)

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable (version via rust-toolchain.toml)

      - name: Prepare stub runtime dir (tauri-build asserts the path exists)
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path src-tauri/resources/runtime | Out-Null

      - name: Install cargo tools (nextest, pinned like the Linux job)
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1  # v2 (SHA-pinned)
        with:
          tool: cargo-nextest@0.9.143

      - name: Rust tests on Windows host (nextest)
        # Platform-independent unit/property/golden tests really execute on
        # the Windows host (the #[cfg(unix)] process-level suites are skipped
        # by design — their semantics are covered by the 3-platform smoke).
        run: cargo nextest run --workspace

      - name: Rust formatting & clippy (workspace, Windows host)
        run: |
          cargo fmt --check --manifest-path crates/dsh-sidecar/Cargo.toml
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo clippy --workspace --all-targets -- -D warnings
