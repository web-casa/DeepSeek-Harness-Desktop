[package]
name = "deepseek-harness-desktop"
version = "0.2.3"
description = "DeepSeek Harness Desktop — community desktop packaging of DeepSeek Harness"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# The sidecar's library surface: PlatformChild gives the plugin installer the
# SAME process-tree guarantees (unix process group / Windows Job Object).
dsh-sidecar = { path = "../crates/dsh-sidecar" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[dev-dependencies]
proptest = "1"
