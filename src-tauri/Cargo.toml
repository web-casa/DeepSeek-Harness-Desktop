[package]
name = "deepseek-harness-desktop"
version = "0.1.0"
description = "DeepSeek Harness Desktop — community desktop packaging of DeepSeek Harness"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
