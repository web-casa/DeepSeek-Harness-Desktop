[package]
name = "deepseek-harness-desktop"
version = "0.2.11"
description = "DSH Desktop — community desktop packaging of DeepSeek Harness"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Remote .dshpreset download and cordis.run market requests. rustls keeps the
# supply chain to a single TLS backend (already transitive via
# tauri-plugin-updater); no native-tls/OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
getrandom = "0.2"
# The sidecar's library surface: PlatformChild gives the plugin installer the
# SAME process-tree guarantees (unix process group / Windows Job Object).
# The version must stay in lockstep with crates/dsh-sidecar/Cargo.toml —
# cargo-deny treats a version-less path dep as a wildcard, so it is pinned.
dsh-sidecar = { path = "../crates/dsh-sidecar", version = "0.2.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
url = "2"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[dev-dependencies]
proptest = "1"

[target.'cfg(windows)'.dependencies]
# Needed for no-follow private-file handles and atomic replacement of
# Desktop-owned state. This is already pinned by dsh-sidecar; declare it
# directly because Rust crates may not rely on transitive dependencies.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW closes the final-component check/open race for Desktop-owned
# private state and user-selected sideload archives.
libc = "0.2"
